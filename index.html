<title>Mandaí – protótipo de mensageiro</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito:wght@400;600;700&family=Lora:wght@400;600&family=Bricolage+Grotesque:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&family=Caveat:wght@600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ff;--panel:#fff;--ink:#0f1b3d;--mute:#6b7a99;--line:#e3eaf7;--out:#2b7cf6;--outink:#fff;--in:#fff;--chip:#e6f0ff;--ok:#22b573;--hl:#ffb347}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e18;--panel:#0f1524;--ink:#e9eef8;--mute:#8794ad;--line:#1b2438;--out:#2f7df6;--outink:#fff;--in:#161e31;--chip:#152447}}
:root[data-theme="dark"]{--bg:#0a0e18;--panel:#0f1524;--ink:#e9eef8;--mute:#8794ad;--line:#1b2438;--out:#2f7df6;--outink:#fff;--in:#161e31;--chip:#152447}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--out);outline-offset:2px}
.app{height:100%;display:flex;max-width:1100px;margin:0 auto;background:var(--panel)}
.side{width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.main{display:none;flex:1;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.app.open .side{display:none}.app.open .main{display:flex}
@media(min-width:760px){.side{width:340px;flex:none}.main,.app.open .side{display:flex}.back{display:none}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.ib:hover{background:var(--bg)}
.search{margin:0 16px 10px;padding:11px 16px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:8px;padding:0 16px 10px}
.chip{padding:6px 14px;border-radius:16px;background:var(--bg);color:var(--mute);font-size:14px;font-weight:600}
.chip.on{background:var(--chip);color:var(--out)}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left}
.row:hover,.row.on{background:var(--bg)}
.row.on{box-shadow:inset 3px 0 0 var(--out)}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;position:relative}
.av.online::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;font-size:16px}
.meta span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{text-align:right;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.badge{background:var(--out);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px;font-weight:600;text-align:center}
.head{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.head .av{width:40px;height:40px;border-radius:14px}
.head .meta b{font-size:16px}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.6px);background-size:22px 22px}
.day{align-self:center;background:var(--chip);color:var(--mute);font-size:12px;padding:3px 12px;border-radius:10px;margin:6px 0}
.m{max-width:78%;padding:8px 12px 6px;border-radius:18px;font-size:15.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.m{box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.m.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
.m.in+.m.in{border-top-left-radius:6px}.m.out+.m.out{border-top-right-radius:6px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,var(--out),color-mix(in srgb,var(--out) 68%,#e0577a));color:var(--outink);border-bottom-right-radius:6px}
.m small{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px}
.m.new{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.typing{align-self:flex-start;background:var(--in);padding:10px 14px;border-radius:18px;border-bottom-left-radius:6px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-4px)}}
.compose{display:flex;gap:8px;padding:8px 12px 12px;background:transparent}
.compose input{flex:1;padding:13px 18px;border-radius:24px;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:16px;min-width:0;box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 10%,transparent)}
.send{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--out),color-mix(in srgb,var(--out) 68%,#e0577a));color:#fff;flex:none;display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--out) 40%,transparent)}
.send:active{transform:scale(.94)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
.main{position:relative}
.msgs{background-color:color-mix(in srgb,var(--out) 7%,var(--bg))}
.m.in{cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:5;animation:up .2s ease-out}
.sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{font-size:17px;margin-bottom:10px}
.sheet p{font-size:15px;line-height:1.5;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-weight:600}
.sw{display:flex;gap:12px;margin:8px 0 14px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.later{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--chip);font-size:14px}
.later b{flex:1;font-weight:600}
.later button{color:var(--out);font-weight:700}
.stories{display:flex;gap:14px;padding:0 16px 12px;overflow-x:auto;flex:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:62px}
.st small{font-size:12px;color:var(--mute);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;display:block}
.ring .av{width:52px;height:52px;border-radius:50%;border:3px solid var(--panel)}
.viewer{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:20;display:flex;flex-direction:column;color:#fff;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer[hidden]{display:none}
.bars{display:flex;gap:4px;padding:12px 12px 0}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
@keyframes fill{from{width:0}to{width:100%}}
.vh{display:flex;align-items:center;gap:10px;padding:12px;position:relative;z-index:2}
.vh .av{width:38px;height:38px;border-radius:50%;font-size:13px;background:rgba(255,255,255,.25)}
.vh small{opacity:.85}
.x{color:#fff;font-size:22px;width:40px;height:40px}
.vt{flex:1;display:grid;place-items:center;text-align:center;padding:24px;font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.zl,.zr{position:absolute;top:80px;bottom:0;background:none}
.zl{left:0;width:40%}.zr{right:0;width:60%}
.ct{flex:1;background:transparent;border:0;color:#fff;font:inherit;font-size:28px;font-weight:700;text-align:center;resize:none;padding:24px;outline:none}
.ct::placeholder{color:rgba(255,255,255,.6)}
.viewer .sw{justify-content:center}.viewer .sw button.on{border-color:#fff}
.pub{margin:12px;padding:14px;border-radius:14px;background:#fff;color:#16182b;font-weight:700}
.eye{position:relative;z-index:2;margin:0 auto 12px;padding:10px 18px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;font-weight:600}
.vp{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--panel);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:60%;overflow-y:auto}
.vp h3{font-size:17px;margin-bottom:10px}
.vr{display:flex;align-items:center;gap:12px;padding:8px 0}
.vr .av{width:40px;height:40px;border-radius:50%;font-size:14px}
.vr b{flex:1;font-weight:600}.vr small{color:var(--mute)}

}
:root[data-theme="dark"]{--bg:#0e1621;--panel:#17212b;--ink:#e4eaf0;--mute:#7f91a4;--line:#202d3a;--out:#4f93e0;--in:#182533;--chip:#1f3045}

/* ===== v84: participantes, configurações, chamadas em grupo ===== */
.setv.mp{bottom:auto;height:var(--vvh,100%);display:flex;flex-direction:column;overflow:hidden}

.mps{position:relative;margin:2px 14px 0}
.mpq{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));color:var(--ink);font:inherit;font-size:16px;padding:12px 40px 12px 42px;outline:0;-webkit-appearance:none;appearance:none}
.mpi{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);display:flex;pointer-events:none}
.mpx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center}
.mpc{flex:none;padding:12px 20px 4px;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--mute);text-transform:uppercase}
.mpl{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40vh}
.mpe{text-align:center;color:var(--mute);padding:40px 20px}
.snote{display:block}small.snote{margin:-4px 20px 14px;color:var(--mute);font-size:12.5px;line-height:1.4}
.mc{max-height:calc(var(--vvh,100vh) - 16px);overflow-y:auto}
.klgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;box-sizing:border-box;padding:14px 16px 0;max-height:56vh;overflow-y:auto;align-content:start}
.klgrid[data-n="1"]{grid-template-columns:1fr}.klgrid[data-n="2"] .kltile{height:34vh}
.kltile{position:relative;border:0;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font:inherit;height:20vh;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;contain:layout paint}
.kltile.off{opacity:.55}
.klta{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;box-shadow:0 0 0 0 rgba(52,211,153,0);transition:box-shadow .25s}
.kltile.sp .klta{box-shadow:0 0 0 4px rgba(52,211,153,.9)}

.kltile small{font-size:11.5px;opacity:.75;text-align:center}

.klbn .klt{flex:1;min-width:0;display:flex;flex-direction:column}.klbn .klt b{font-size:14.5px}.klbn .klt small{color:var(--mute);font-size:12.5px}

/* ===== v84b: adicionar, contato no grupo, moderação ===== */
.amch{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}.amch::-webkit-scrollbar{display:none}

/* ===== v85: suspensão visível ===== */
.klsu{display:flex;align-items:center;gap:12px;padding:9px 16px;background:color-mix(in srgb,#e5484d 14%,var(--panel));border-bottom:1px solid color-mix(in srgb,#e5484d 35%,var(--line));color:var(--ink)}

.blk{color:#e5484d}

/* ===== v87: avisos de suspensão ===== */
.klsu{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);max-width:496px;margin:0 auto;z-index:14;display:flex;align-items:center;gap:12px;padding:12px 14px 14px;border-radius:18px;border:1px solid color-mix(in srgb,#e5484d 30%,var(--line));background:color-mix(in srgb,var(--panel) 92%,#e5484d);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.35);overflow:hidden;animation:suin .38s cubic-bezier(.2,.9,.3,1) both}
.klsu.out{animation:suout .36s ease-in both}
@keyframes suin{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
@keyframes suout{from{transform:none;opacity:1}to{transform:translateY(-130%);opacity:0}}
.klsu .klsi{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,#ff6b6f,#e5484d)}
.klst b{font-size:15px;color:var(--ink)}.klst small{color:var(--mute);font-size:12.5px;line-height:1.35}.klst em{font-style:normal;font-size:11.5px;font-weight:600;color:#e5484d;margin-top:2px}
.klsb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,#ff6b6f,#e5484d);transform-origin:left;animation:subar 6.5s linear both}
@keyframes subar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.m.sys.modmsg{display:flex;align-items:center;gap:10px;text-align:left;max-width:86%;padding:10px 14px 10px 10px;border-radius:16px;font-weight:400}
.m.sys.modmsg .sci{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}

.m.sys.modmsg .scw{display:flex;flex-direction:column}.m.sys.modmsg b{font-size:13.5px;font-weight:700}.m.sys.modmsg small{font-size:12px;opacity:.8;color:inherit}
.blk.susb{display:flex;align-items:center;gap:12px;justify-content:flex-start;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,#e5484d 11%,var(--panel));border-top:1px solid color-mix(in srgb,#e5484d 30%,var(--line));color:var(--ink)}

.sbt{display:flex;flex-direction:column;text-align:left}.sbt b{font-size:14.5px;color:#e5484d}.sbt small{font-size:12.5px;color:var(--mute)}
.klsu{z-index:35}

/* ===== v88: avisos discretos ===== */
.klsu{display:none!important}

  const k={c,video:!!video,sec:0,answered:false,hold:false,spk:!!video,mute:false,stream:null,timer:0,to:0,ok:!!(c.online||c.group)};

function qrSvg(text){

  const g=Array.from({length:n},()=>Array.from({length:n},()=>rnd()>.52));
  const fin=(x,y)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const yy=y+i,xx=x+j;if(yy>=0&&yy<n&&xx>=0&&xx<n)g[yy][xx]=(i>=0&&i<7&&j>=0&&j<7)&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))}};
  fin(0,0);fin(n-7,0);fin(0,n-7);
  let r='';g.forEach((row,y)=>row.forEach((v,x)=>{if(v)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}));
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" class="qrb" role="img" aria-label="QR Code ilustrativo" fill="currentColor">${r}</svg>`;
}

<script>
(function(){
  var m=document.querySelector('meta[name="theme-color"]');if(!m)return;
  function isDark(){var t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
  function color(){
    var onb=document.getElementById('onb');
    if(onb&&!onb.hidden)return isDark()?'#0d1b2e':'#ebf2ff';
    var e=document.elementFromPoint(Math.floor(window.innerWidth/2),4),c;
    while(e){c=getComputedStyle(e).backgroundColor;if(c&&c!=='rgba(0, 0, 0, 0)'&&c!=='transparent')return c;e=e.parentElement}
    return getComputedStyle(document.body).backgroundColor;
  }
  var tm=0;function sync(){clearTimeout(tm);tm=setTimeout(function(){try{var c=color();if(c&&m.getAttribute('content')!==c)m.setAttribute('content',c)}catch(e){}},120)}
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,subtree:true,attributeFilter:['hidden','class','data-theme','data-acc']});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync)}catch(e){}
  window.addEventListener('load',sync);sync();
})();

<script>
/* ===== Mensagens reais (Supabase) ===== */
const RT={uid:null,ch:null,seen:{},nid:1000,on:false,last:null,status:'não iniciado',err:'',ev:'nenhum',poll:'nenhuma',pn:0};
const rtErr=e=>{RT.err=String((e&&(e.message||e.error_description||e.code))||e||'erro').slice(0,160)};
try{RT.seen=JSON.parse(localStorage.getItem('mandai.seen')||'{}')}catch(e){}
function rtSaveSeen(){try{localStorage.setItem('mandai.seen',JSON.stringify(RT.seen))}catch(e){}}
function rtTel(v){let d=String(v||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return d}
function rtHM(iso){const d=new Date(iso),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString())return t(d.getHours(),d.getMinutes());
  if(d.toDateString()===y.toDateString())return 'Ontem';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function rtChat(rid,p){let c=chats.find(x=>x.rid===rid);if(c)return c;
  c={id:RT.nid++,rid,uid:p.id,user:p.usuario,name:p.nome||('@'+p.usuario),phone:p.telefone?'+'+p.telefone:'',online:false,unread:0,msgs:[],reply:[],real:true};chats.push(c);return c}
const rtCols='id,conversa_id,remetente_id,texto,criado_em,apagada_em,editada_em';
function rtPush(r,initial){
  const c=chats.find(x=>x.rid===r.conversa_id);if(!c||r.apagada_em)return;
  if(!RT.last||r.criado_em>RT.last)RT.last=r.criado_em;
  if(c.msgs.some(m=>m[5]&&m[5].rid===r.id))return;
  const mine=r.remetente_id===RT.uid,m=[mine?'out':'in',r.texto||'',rtHM(r.criado_em),0,null,{st:'sent',rid:r.id,at:r.criado_em,ts:Date.parse(r.criado_em)}];
  if(r.editada_em){m[5].edited=true;m[5].editAt=rtHM(r.editada_em)}
  c.msgs.push(m);
  if(mine)return;
  if(initial){const sn=RT.seen[c.rid];if(sn&&r.criado_em>sn)c.unread++;return}
  if(cur===c){const box=$('#msgs');if(box){box.appendChild(bubble(m,true));scroll()}RT.seen[c.rid]=new Date().toISOString();rtSaveSeen()}
  else{c.unread++;notify(c,m)}
  renderList();
}
async function rtFetchConv(cid){
  try{const r=await SB.from('participantes').select('conversa_id,perfis(id,usuario,nome,telefone),conversas(tipo)').eq('conversa_id',cid).neq('usuario_id',RT.uid);
    (r.data||[]).forEach(x=>{if(x.perfis&&x.conversas&&x.conversas.tipo==='direta')rtChat(x.conversa_id,x.perfis)})}catch(e){}
}
async function rtLoad(){
  try{
    const a=await SB.from('participantes').select('conversa_id,conversas(tipo)').eq('usuario_id',RT.uid).is('saiu_em',null);
    if(a.error)throw a.error;
    const ids=(a.data||[]).filter(x=>x.conversas&&x.conversas.tipo==='direta').map(x=>x.conversa_id);
    if(!ids.length){renderList();return}
    const [o,m]=await Promise.all([
      SB.from('participantes').select('conversa_id,perfis(id,usuario,nome,telefone)').in('conversa_id',ids).neq('usuario_id',RT.uid),
      SB.from('mensagens').select(rtCols).in('conversa_id',ids).order('criado_em',{ascending:false}).limit(1000)]);
    if(o.error)throw o.error;
    (o.data||[]).forEach(x=>{if(x.perfis)rtChat(x.conversa_id,x.perfis)});
    (m.data||[]).slice().sort((a,b)=>a.criado_em<b.criado_em?-1:1).forEach(r=>rtPush(r,true));
    renderList();
  }catch(e){rtErr(e);snack('Sem conexão para carregar as conversas.')}
}
async function rtSync(){
  try{let q=SB.from('mensagens').select(rtCols).order('criado_em').limit(500);if(RT.last)q=q.gt('criado_em',RT.last);
    const r=await q;if(r.error||!r.data)return;
    const miss=[...new Set(r.data.map(x=>x.conversa_id).filter(id=>!chats.some(c=>c.rid===id)))];
    for(const id of miss)await rtFetchConv(id);
    r.data.forEach(x=>rtPush(x,false));
  }catch(e){}
}
function rtSubscribe(){
  try{if(RT.ch)SB.removeChannel(RT.ch)}catch(e){}
  RT.ch=SB.channel('mandai-msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens'},async p=>{
    const r=p.new;RT.ev=new Date().toLocaleTimeString('pt-BR');if(!r||r.remetente_id===RT.uid)return;
    if(!chats.some(c=>c.rid===r.conversa_id))await rtFetchConv(r.conversa_id);
    rtPush(r,false);
  }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'mensagens'},p=>{
    const r=p.new;if(!r||!r.editada_em)return;
    for(const c of chats){const m=c.msgs.find(x=>x[5]&&x[5].rid===r.id);if(m){if(m[1]===(r.texto||''))return;m[1]=r.texto||'';m[5].edited=true;m[5].editAt=rtHM(r.editada_em);if(cur===c&&typeof paintMsgs==='function')paintMsgs();renderList();return}}
  }).subscribe((st,er)=>{RT.status=st+(er?' '+(er.message||er):'');if(st==='SUBSCRIBED')rtSync()});
}
async function realStart(){
  if(!SB||!me.sb)return;
  let u=null;try{const ss=await SB.auth.getSession();u=ss&&ss.data&&ss.data.session&&ss.data.session.user}catch(e){}
  if(!u||(RT.on&&RT.uid===u.id))return;
  RT.uid=u.id;RT.on=true;window._demoOff=true;
  chats.length=0;requests.length=0;Object.keys(stat).forEach(k=>delete stat[k]);renderList();
  try{const pf=await SB.from('perfis').select('telefone').eq('id',u.id).maybeSingle();
    if(pf&&pf.data&&pf.data.telefone&&!me.phone){me.phone='+'+pf.data.telefone;saveAcc()}
    else if(me.phone&&!(pf&&pf.data&&pf.data.telefone))rtSavePhone(true)}catch(e){}
  await rtLoad();rtSubscribe();
}
async function rtSend(chat,txt,m){
  try{const r=await SB.from('mensagens').insert({conversa_id:chat.rid,remetente_id:RT.uid,texto:txt}).select('id,criado_em').single();
    if(r.error)throw r.error;m[5].rid=r.data.id;m[5].at=r.data.criado_em;if(!RT.last||r.data.criado_em>RT.last)RT.last=r.data.criado_em}
  catch(e){rtErr(e);m[5].st='fail';snack('Não foi possível enviar. Verifique a internet.');renderList()}
}
async function rtEdit(m,v){
  try{const r=await SB.from('mensagens').update({texto:v,editada_em:new Date().toISOString()}).eq('id',m[5].rid);if(r.error)throw r.error}
  catch(e){snack('Não foi possível salvar a edição. Verifique a internet.')}
}
async function rtDiag(){
  const c=n=>chats.filter(x=>x.rid).length;
  showModal('<h3>Diagnóstico das mensagens</h3><div id="dgx" class="note" style="text-align:left;white-space:pre-line;font-size:14px;line-height:1.5"></div><button class="btn" id="dgb">Buscar mensagens agora</button><button class="btn ghost" id="dgc">Fechar</button>');
  const bd=(document.querySelector('meta[name="mandai-build"]')||{}).content||'?';
  const paint=async(extra)=>{
    let srv='';try{const a=await SB.from('participantes').select('conversa_id',{count:'exact',head:true}).eq('usuario_id',RT.uid);const m=await SB.from('mensagens').select('id',{count:'exact',head:true});srv='No servidor: '+(a.error?'erro '+a.error.message:a.count+' conversa(s)')+' · '+(m.error?'erro '+m.error.message:m.count+' mensagem(ns)')}catch(e){srv='No servidor: erro '+((e&&e.message)||e)}
    const loc=chats.filter(x=>x.rid);
    $('#dgx').textContent=['Versão: '+bd,'Conta: '+(RT.uid?RT.uid.slice(0,8):'sem login'),'Tempo real: '+RT.status,'Último aviso em tempo real: '+RT.ev,'Verificação automática: '+RT.poll+' ('+RT.pn+' novas)','No aparelho: '+loc.length+' conversa(s) · '+loc.reduce((n,x)=>n+x.msgs.length,0)+' mensagem(ns)',srv,'Último erro: '+(RT.err||'nenhum')].concat(extra?[extra]:[]).join('\n');
  };
  paint();$('#dgc').onclick=closeModal;
  $('#dgb').onclick=async()=>{$('#dgb').disabled=true;RT.err='';await rtLoad();await rtSync();renderList();await paint('Atualizado agora.');$('#dgb').disabled=false};
}
async function rtSavePhone(silent){
  try{const r=await SB.rpc('salvar_telefone',{t:me.phone||''});if(r.error)throw r.error;if(!silent)snack('Telefone salvo')}
  catch(e){if(!silent)snack('Não foi possível salvar o telefone agora.')}
}
let _rts=0;
function rtSearch(v,res){
  clearTimeout(_rts);res.innerHTML='';v=(v||'').trim();if(!me.sb||!SB)return;
  if(!v)return;
  const hint=t=>{res.innerHTML='';res.appendChild(mk('p','note',t))};
  const isTel=/^[\d\s()+-]+$/.test(v)&&rtTel(v).length>=12,isU=/^@?[a-z0-9_.]{3,30}$/i.test(v);
  if(!isTel&&!isU){
    if(/^[\d\s()+-]+$/.test(v))hint('Digite o telefone completo, com DDD. Exemplo: (95) 99999-9999.');
    else if(/\s/.test(v))hint('Procure pelo @ da pessoa, sem espaços, e não pelo nome. Exemplo: maria.silva');
    else if(v.replace(/^@/,'').length<3)hint('Digite pelo menos 3 letras do @.');
    else hint('O @ só tem letras sem acento, números, ponto e _. Confira o que você digitou.');
    return}
  if(isU)v=v.replace(/^@/,'').toLowerCase();
  res.appendChild(mk('p','note','Procurando…'));
  _rts=setTimeout(async()=>{
    let r;try{r=await SB.rpc('buscar_pessoa',{q:v})}catch(e){r={error:e}}
    res.innerHTML='';
    if(r.error){res.appendChild(mk('p','note','Não foi possível buscar agora. Verifique a internet.'));return}
    if(!r.data||!r.data.length){res.appendChild(mk('p','note','Ninguém encontrado com esse @ ou telefone. Confira se está certo.'));return}
    res.appendChild(mk('h4',0,'Pessoas no Mandaí'));
    r.data.forEach(p=>res.appendChild(srow2('av',colors[0],(p.nome||p.usuario).split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(),p.nome||p.usuario,'@'+p.usuario,()=>rtOpenWith(p))));
  },350);
}
async function rtOpenWith(p){
  try{let c=chats.find(x=>x.uid===p.id);
    if(!c){const r=await SB.rpc('abrir_conversa_direta',{outro:p.id});if(r.error)throw r.error;c=rtChat(r.data,p)}
    c.hidden=false;closePages();try{closeModal()}catch(e){}renderList();open(c.id)}
  catch(e){snack('Não foi possível abrir a conversa agora.')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&RT.on)rtSync()});
setInterval(async()=>{if(!RT.on||document.hidden)return;const n0=chats.reduce((n,c)=>n+c.msgs.length,0);await rtSync();const n1=chats.reduce((n,c)=>n+c.msgs.length,0);RT.poll=new Date().toLocaleTimeString('pt-BR');if(n1>n0)RT.pn+=n1-n0},5000);
addEventListener('online',()=>{if(RT.on)rtSync()});
(function(){const _rl=renderList;renderList=function(){_rl.apply(this,arguments);try{const L=$('#list');if(me.sb&&RT.on&&!chats.length&&L&&!L.children.length){const p=mk('p','note','Nenhuma conversa ainda.\nToque no botão + e procure alguém pelo @ ou telefone.');p.style.cssText='text-align:center;padding:48px 24px;white-space:pre-line';L.appendChild(p)}}catch(e){}}})();
</script>
